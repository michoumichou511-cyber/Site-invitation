<title>Lou'lou'a Héro 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: phone pinned at center of a tall scroll stage, copy on one side, floating feature chips orbiting the phone; Casbah palette (whitewash, Casbah blue, terracotta). Single deliberate light look. */
:root{
  --chaux:#F6F4EE;      /* whitewash ground */
  --chaux-2:#ECE8DD;    /* deeper wall */
  --casbah:#1F4E79;     /* Casbah blue */
  --ink:#13263A;        /* text */
  --terra:#C46A4A;      /* terracotta accent */
  --muted:#5E6B78;      /* secondary text */
  --card:#FFFFFF;
  --f-display:"Marcellus","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ar-display:"Reem Kufi","Noto Kufi Arabic","Geeza Pro",sans-serif;
  --f-body:"Tajawal","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--chaux);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.6;overflow-x:hidden}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding-block:14px;background:color-mix(in srgb,var(--chaux) 88%,transparent);backdrop-filter:blur(8px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--chaux)}
.logo{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;color:var(--casbah);display:flex;gap:10px;align-items:center}
.logo i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9e2d3 45%,#c9bfae);box-shadow:0 0 0 1px #d8cfbf}
[dir=rtl] .logo{font-family:var(--f-ar-display)}
.lang{display:flex;border:1px solid var(--chaux-2);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{all:unset;cursor:pointer;padding:6px 14px;font-size:14px;font-weight:700;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--casbah);color:#fff}
.lang button:focus-visible{outline:2px solid var(--terra);outline-offset:-2px}

/* stage */
.stage{position:relative;height:330vh}
.pin{position:sticky;top:0;height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:24px;max-width:1180px;margin-inline:auto}
.copy{display:flex;flex-direction:column;gap:18px;z-index:2}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,5.4vw,72px);line-height:1.02;margin:0;text-wrap:balance;color:var(--ink)}
[dir=rtl] h1{font-family:var(--f-ar-display);font-weight:700;line-height:1.25}
h1 em{font-style:normal;color:var(--casbah)}
.lead{max-width:44ch;color:var(--muted);margin:0}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{all:unset;cursor:pointer;padding:13px 22px;border-radius:999px;font-weight:700;font-size:16px}
.btn.primary{background:var(--casbah);color:#fff}
.btn.ghost{border:1.5px solid var(--casbah);color:var(--casbah)}
.btn:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.steps{display:flex;gap:8px;margin-top:6px}
.steps span{height:4px;flex:1;max-width:56px;border-radius:2px;background:var(--chaux-2);transition:background .3s}
.steps span.on{background:var(--terra)}
.caption{font-size:14px;color:var(--muted);min-height:1.6em}

.scene{position:relative;height:min(78svh,720px);width:100%}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
/* arch behind the phone: Casbah doorway */
.arch{position:absolute;inset:6% 14% 0;border-radius:999px 999px 0 0;background:linear-gradient(180deg,var(--chaux-2),transparent 92%);border:1px solid #e3ddd0;border-bottom:0}
.chip{position:absolute;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid #e7e1d4;border-radius:16px;padding:10px 14px;box-shadow:0 10px 30px -12px rgba(19,38,58,.25);font-size:14px;line-height:1.25;z-index:3;will-change:transform}
.chip b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--terra)}
.chip .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--casbah) 10%,#fff);color:var(--casbah);flex:none}
.chip svg{width:18px;height:18px}
.c1{top:10%;inset-inline-start:0}
.c2{top:34%;inset-inline-end:0}
.c3{bottom:26%;inset-inline-start:2%}
.c4{bottom:8%;inset-inline-end:4%}
.fallback{position:absolute;inset:0;display:grid;place-items:center}
.fallback canvas{height:88%;width:auto;border-radius:34px;border:10px solid #18222d;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}

.after{max-width:1180px;margin-inline:auto;padding-block:72px 96px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.after h2{grid-column:1/-1;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,40px);margin:0 0 8px;text-wrap:balance}
[dir=rtl] .after h2{font-family:var(--f-ar-display)}
.tile{background:var(--card);border:1px solid #e7e1d4;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px}
.tile .n{font-family:var(--f-display);font-size:30px;color:var(--terra)}
.tile p{margin:0;color:var(--muted)}
.note{grid-column:1/-1;font-size:13px;color:var(--muted)}

@media (max-width:820px){
  .pin{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start;padding-top:70px;gap:6px}
  .copy{gap:10px}
  h1{font-size:clamp(30px,8.5vw,40px)}
  .lead{font-size:15px}
  .ctas .ghost{display:none}
  .scene{height:56svh}
  .chip{font-size:12px;padding:8px 10px}
  .chip .ic{width:26px;height:26px}
  .after{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.stage{height:auto}.pin{position:relative}}
</style>

</section>

function resize(){ if(!renderer) return; const r=scene.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); cam.aspect=r.width/r.height; cam.position.z = r.width<420?8.4:7.2; cam.updateProjectionMatrix(); }
const state={ry:-.42,rx:.08,y:0,float:0};
function loop(t){ if(!glOk) return; state.float=reduce?0:Math.sin(t/900)*.05; phone.rotation.set(state.rx,state.ry,0); phone.position.y=state.y+state.float; renderer.render(scn,cam); requestAnimationFrame(loop); }

/* ---------- i18n ---------- */
function apply(){
  const L=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t; if(L[k]!==undefined) el.innerHTML=L[k];});
  document.getElementById("btn-fr").setAttribute("aria-pressed",lang==="fr"); document.getElementById("btn-ar").setAttribute("aria-pressed",lang==="ar");
  document.getElementById("caption").textContent=L.caps[idx]; tick(); drawScreen();
}
function setIdx(i){ if(i===idx) return; idx=i; document.querySelectorAll(".steps span").forEach((s,k)=>s.classList.toggle("on",k<=i)); document.getElementById("caption").textContent=T[lang].caps[i]; drawScreen(); }
function tick(){ const L=T[lang]; const ms=eventDate-Date.now(); const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5); document.getElementById("cd").textContent=d+" "+L.days+" · "+h+" "+L.hrs; }
setInterval(tick,60000);
document.getElementById("btn-fr").onclick=()=>{lang="fr";apply();};
document.getElementById("btn-ar").onclick=()=>{lang="ar";apply();};
document.getElementById("cta1").onclick=()=>document.querySelector(".after").scrollIntoView({behavior:"smooth"});
document.getElementById("cta2").onclick=()=>document.querySelector(".after").scrollIntoView({behavior:"smooth"});

/* ---------- boot ---------- */
glOk=initGL();
if(!glOk){ canvas.remove(); const f=document.createElement("div"); f.className="fallback"; f.appendChild(screen); scene.appendChild(f); }
addEventListener("resize",resize);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(apply);
apply();
if(glOk) requestAnimationFrame(loop);

/* ---------- scroll choreography ---------- */
if(window.gsap && window.ScrollTrigger && !reduce){
  gsap.registerPlugin(ScrollTrigger);
  ScrollTrigger.create({trigger:"#stage",start:"top top",end:"bottom bottom",scrub:.6,
    onUpdate:self=>{
      const p=self.progress, dir=lang==="ar"?-1:1;
      // full turn across the stage, design swaps when the phone shows its back (edge-on)
      state.ry=dir*(-.42+p*Math.PI*2*1.0);
      state.rx=.08+Math.sin(p*Math.PI)*.12;
      state.y=Math.sin(p*Math.PI*2)*.08;
      setIdx(p<.33?0:p<.66?1:2);
    }});
  gsap.utils.toArray(".chip").forEach((c,i)=>{
    gsap.to(c,{y:(i%2?-1:1)*60,x:(i<2?1:-1)*14,ease:"none",scrollTrigger:{trigger:"#stage",start:"top top",end:"bottom bottom",scrub:1}});
  });
  if(!glOk){ ScrollTrigger.create({trigger:"#stage",start:"top top",end:"bottom bottom",onUpdate:s=>setIdx(s.progress<.33?0:s.progress<.66?1:2)}); }
}
})();
</script>
