name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migration D1 (locale)
        run: pnpm db:migrate:local
        env:
          CI: "1"

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: cp .dev.vars.example .dev.vars
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  performance:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: cp .dev.vars.example .dev.vars
      - name: Base locale + démos
        run: pnpm db:migrate:local && pnpm db:seed:local
        env:
          CI: "1"
      - name: Build Cloudflare (OpenNext)
        run: pnpm exec opennextjs-cloudflare build
      - name: Worker local (conditions Cloudflare)
        run: |
          pnpm exec wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8787/fr > /dev/null && break; sleep 2; done
      - name: Budget des invitations (JS, polices, images)
        run: node scripts/check-budget.mjs http://localhost:8787/i/demo-karakou
      - name: Lighthouse mobile (accueil fr/ar + invitation, échec sous 85)
        run: npx --yes @lhci/cli@0.15.1 autorun
